{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        /* Reset básico */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
        }
        
        /* Container principal */
        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        /* Header con logo */
        .email-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }
        
        .email-header h1 {
            margin: 10px 0 0 0;
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #e0d5ff 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            letter-spacing: 2px;
        }
        
        .email-header .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        /* Cuerpo del email */
        .email-body {
            padding: 30px 20px;
            color: #333333;
            line-height: 1.6;
        }
        
        .greeting {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #667eea;
        }
        
        /* Contenido principal */
        .content {
            font-size: 15px;
            margin-bottom: 20px;
        }
        
        /* Info box (para mostrar datos importantes) */
        .info-box {
            background-color: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        
        .info-box h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #667eea;
        }
        
        .info-box p {
            margin: 5px 0;
            font-size: 14px;
        }
        
        .info-label {
            font-weight: 600;
            color: #555;
        }
        
        /* Botones */
        .button-container {
            text-align: center;
            margin: 30px 0;
        }
        
        .button {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s;
        }
        
        .button:hover {
            transform: translateY(-2px);
        }
        
        .button-secondary {
            background: #6c757d;
        }
        
        /* Footer */
        .email-footer {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 13px;
            color: #666666;
            border-top: 1px solid #e0e0e0;
        }
        
        .email-footer a {
            color: #667eea;
            text-decoration: none;
        }
        
        /* Separador */
        .divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 20px 0;
        }
        
        /* Alerts */
        .alert {
            padding: 12px 15px;
            border-radius: 6px;
            margin: 15px 0;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
        
        .alert-warning {
            background-color: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        
        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border-left: 4px solid #17a2b8;
        }
        
        /* Responsive */
        @media only screen and (max-width: 600px) {
            .email-container {
                margin: 0;
                border-radius: 0;
            }
            
            .email-body {
                padding: 20px 15px;
            }
            
            .button {
                display: block;
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header -->
        <div class="email-header">
            <div class="logo">💈</div>
            <h1>BARBERB</h1>
        </div>
        
        <!-- Body -->
        <div class="email-body">
            <p class="greeting">Hola {{ user_name }},</p>
            
            {% block content %}
            <!-- El contenido específico del email va aquí -->
            {% endblock %}
        </div>
        
        <!-- Footer -->
        <div class="email-footer">
            <p><strong>BarberB</strong> - Tu barbería de confianza</p>
            <p>Este es un email automático, por favor no responder.</p>
            <p>
                <a href="{{ site_url }}">Visitar sitio web</a> | 
                <a href="{{ site_url }}/perfil/seguridad">Configurar notificaciones</a>
            </p>
            <p style="margin-top: 15px; color: #999; font-size: 12px;">
                © 2025 BarberB. Todos los derechos reservados.
            </p>
        </div>
    </div>
</body>
</html>
