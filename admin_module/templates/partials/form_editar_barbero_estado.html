<form method="post" action="{% url 'admin_module:editar_barbero_estado' object.pk %}">
  {% csrf_token %}

  <div class="modal-body">

    <div class="mb-3">
      <label for="{{ form.barber.id_for_label }}" class="form-label">Barbero</label>
      {{ form.barber }}
    </div>

    <div class="mb-3">
      <label for="{{ form.status.id_for_label }}" class="form-label">Estado</label>
      {{ form.status }}
    </div>

  </div>

  <div class="modal-footer">
    <button type="submit" class="btn btn-primary">Guardar cambios</button>
  </div>
</form>
