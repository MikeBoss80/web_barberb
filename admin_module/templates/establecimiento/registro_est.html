<div class="modal-header bg-dark text-white">
    <h5 class="modal-title">Nuevo Establecimiento</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body">
    <h2>Crea Tu Establecimiento</h2>
    <form id="form-modal-est" method="post" action="../registro_est/">
        {% csrf_token %}
        {{ form.as_p }}
    </form>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
    <button type="submit" form="form-modal-est" class="btn btn-primary">Guardar Establecimiento</button>
</div>
