{% load static %}
{% load form_tags %}

{% block content %}
<link rel="stylesheet" href="{% static 'login_module/css/registro_usuario.css' %}">

<div class="container">
    <div class="form-box">
        <h2 class="mb-4">Registro</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Registrarse</button>
        </form>

        <p class="mt-3 legal">¿Ya tienes una cuenta? <a href="{% url 'login_module:login' %}">Iniciar sesión</a></p>
        <p class="mt-3 legal">acepta<a href="{% url 'login_module:terminosycondiciones' %}">Terminos y Condiciones</a></p>
    </div>
</div>
{% endblock %}
