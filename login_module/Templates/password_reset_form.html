{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'login_module/css/password_reset_form.css' %}">


<div class="recovery-container">
  <h2>¿Olvidaste tu contraseña?</h2>
  <p>Ingresa tu correo y te enviaremos instrucciones para restablecerla.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.email.label_tag }}
    {{ form.email }}
    <button type="submit" class="btn" id="recuperar">Enviar correo de recuperación</button>
  </form>
</div>

{% endblock %}
