{% extends "services_module/base_services.html" %}

{% load static %}


{% block title %}Agenda de Citas{% endblock %}


{% block extra_css %}
<link rel="stylesheet" href="{% static 'services_module/css/map.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
{% endblock %}


{% block content %}

<style>
  html,
  body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  #map {
    width: 100%;
    height: 100%;
    min-height: 400px;
  }

  .map-section {
    height: 80vh;
  }

  .results-section {
    max-height: 80vh;
    overflow-y: auto;
  }

  .search-bar {
    margin-top: 10px;
  }
</style>

<body>

  <div class="container-fluid">
    <div class="row g-2">
      <!-- Mapa y buscador -->
      <div class="col-md-9 map-section">
        <div id="map"></div>
        <div class="d-flex gap-2 search-bar">
          <input type="text" class="form-control" id="inputSearch" placeholder="Buscar en el mapa...">
          <button class="btn btn-outline-secondary" type="button" id="btnSearch">Buscar</button>
        </div>
      </div>

      <!-- Lista de lugares -->
      <div class="col-md-3 results-section">
        <div id="listPlaces"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Tu script personalizado (incluye toda la lógica del mapa y búsqueda) -->
  <script>
    // Aquí pega el código JavaScript completo que me compartiste, tal cual.
    // (No lo repito por extensión, pero ya sabes cuál es).
    document.addEventListener('DOMContentLoaded', function () {
      fetch('http://127.0.0.1:8000/services_module/getmap/').then(response => {
        if (response.ok) {
          response.json().then(data => {
            (g => {
              var h, a, k, p = "The Google Maps JavaScript API", c = "google", l = "importLibrary", q = "__ib__", m = document, b = window;
              b = b[c] || (b[c] = {});
              var d = b.maps || (b.maps = {}), r = new Set, e = new URLSearchParams, u = () => h || (h = new Promise(async (f, n) => {
                await (a = m.createElement("script"));
                e.set("libraries", [...r] + "");
                for (k in g) e.set(k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()), g[k]);
                e.set("callback", c + ".maps." + q);
                a.src = `https://maps.${c}apis.com/maps/api/js?` + e;
                d[q] = f;
                a.onerror = () => h = n(Error(p + " could not load."));
                a.nonce = m.querySelector("script[nonce]")?.nonce || "";
                m.head.append(a)
              }));
              d[l] ? console.warn(p + " only loads once. Ignoring:", g) : d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n))
            })({
              key: data.mapApiKey,
              v: "weekly"
            });
            initMap();
          });
        }
      });
    });

    let map;

    async function initMap() {
      const { Map } = await google.maps.importLibrary("maps");
      const { PlacesService } = await google.maps.importLibrary("places");
      let ubicationUser = new google.maps.LatLng(4.679531063698843, -74.04015630448359);

      map = new Map(document.getElementById("map"), {
        center: ubicationUser,
        zoom: 15,
      });

      let inputSearch = document.getElementById("inputSearch");
      document.getElementById("btnSearch").addEventListener("click", function () {
        let searchValue = inputSearch.value;
        if (searchValue) {
          const request = {
            location: '4.679531063698843,-74.04015630448359',
            query: searchValue,
            radius: 500
          };
          getPlacesList(request);
        } else {
          alert("Por favor ingrese un lugar a buscar");
        }
      });
    }

    function createMarker(place) {
      if (!place.geometry || !place.geometry.location) return;

      const marker = new google.maps.Marker({
        map,
        position: place.geometry.location,
      });

      google.maps.event.addListener(marker, "click", () => {
        infowindow.setContent(place.name || "");
        infowindow.open(map);
      });
    }

    function getPlacesList(params) {
      let url = 'http://127.0.0.1:8000/services_module/getplacesbysearch';
      url += `?query=${params.query}&location=${params.location}&radius=${params.radius}`;
      fetch(url).then(response => {
        if (response.ok) {
          response.json().then(data => {
            for (let i = 0; i < data.results.length; i++) {
              createMarker(data.results[i]);
            }
            loadPlacesList(data.results);
            map.setCenter(data.results[0].geometry.location);
          });
        }
      });
    }

    function loadPlacesList(dataPlaces) {
      let list = document.getElementById("listPlaces");
      list.innerHTML = '';
      dataPlaces.forEach((place) => {
        const card = document.createElement('div');
        card.className = 'card mb-2';
        card.style.width = '100%';
        card.innerHTML = `
                <img src="https://placehold.co/100x50" class="card-img-top" alt="${place.name}">
                <div class="card-body">
                    <h6 class="card-title">${place.name}</h6>
                    <div class="row">
                        <div class="col-6">
                            <button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                                Solicitar
                            </button>
                        </div>
                        <div class="col-6 text-end">
                            <span class="text-muted">${place.rating ?? 0.0} <i class="bi bi-star-fill"></i></span>
                        </div>
                    </div>
                </div>
            `;
        list.appendChild(card);
      });
    }
  </script>

  <script src="../static/js/map.js"></script>
  {% endblock %}

  {% endblock %}
