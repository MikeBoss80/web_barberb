<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso no autorizado</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem 3rem;
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
        }

        a {
            margin-top: 1.5rem;
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: #ffffff33;
            border: 1px solid white;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            transition: background 0.3s;
        }

        a:hover {
            background-color: #ffffff55;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Acceso restringido</h1>
        <p>Tu usuario no pertenece a los grupos permitidos para esta acción.</p>
        <a href="{% url 'core:main' %}">Volver</a>
    </div>
</body>
</html>
