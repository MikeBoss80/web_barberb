{% load static %}

<!-- Línea divisora de sección -->
<div class="section-divider"></div>

<!-- Sección Desarrolladores -->
<section class="team-section py-5">
    <div class="container">
        <div class="row justify-content-center mb-5">
            <div class="col-md-10 text-center">
                <h2 class="team-title">Equipo De Desarrolladores</h2>
            </div>
        </div>
        
        <!-- Primera fila: 3 desarrolladores -->
        <div class="row justify-content-center mb-4">
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="team-card">
                    <div class="team-image-container">
                        <img src="{% static 'core/img/miguel.jpg' %}" class="team-image" alt="Miguel Bolívar">
                        <div class="founder-badge">
                            <i class="fas fa-crown"></i>
                            <span>FUNDADOR</span>
                        </div>
                    </div>
                    <div class="team-content">
                        <h5 class="team-name">Miguel Bolívar</h5>
                        <p class="team-role">Desarrollador Full-Stack</p>
                        <div class="founder-divider"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="team-card">
                    <div class="team-image-container">
                        <img src="{% static 'core/img/danilo.jpg' %}" class="team-image" alt="Jose Danilo Santos">
                        <div class="founder-badge">
                            <i class="fas fa-crown"></i>
                            <span>FUNDADOR</span>
                        </div>
                    </div>
                    <div class="team-content">
                        <h5 class="team-name">Jose Danilo Santos</h5>
                        <p class="team-role">Desarrollador Full-Stack</p>
                        <div class="founder-divider"></div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="team-card">
                    <div class="team-image-container">
                        <img src="{% static 'core/img/eliza.jpg' %}" class="team-image" alt="Elizabeth Ariza">
                    </div>
                    <div class="team-content">
                        <h5 class="team-name">Elizabeth Ariza</h5>
                        <p class="team-role">Desarrollador Front-End</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Segunda fila: 2 desarrolladores centrados -->
        <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="team-card">
                    <div class="team-image-container">
                        <img src="{% static 'core/img/mauro.jpg' %}" class="team-image" alt="Johan Mauricio Perez">
                    </div>
                    <div class="team-content">
                        <h5 class="team-name">Johan Mauricio Perez</h5>
                        <p class="team-role">Desarrollador Back-End</p>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="team-card">
                    <div class="team-image-container">
                        <img src="{% static 'core/img/gabriel.jpg' %}" class="team-image" alt="Gabriel Delgado">
                    </div>
                    <div class="team-content">
                        <h5 class="team-name">Gabriel Delgado</h5>
                        <p class="team-role">Desarrollador Front-End</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
