<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/login_module/Css/registro_administrador.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <title>Register/Admin</title>
</head>
<body>
  <div class="form-container">
  <h2>Registro de Administrador</h2>
  <form method="POST" action="{% url 'registro_administrador' %}">
    {% csrf_token %}
    <input type="text" name="nombre" placeholder="Nombre" required>
    <input type="email" name="correo" placeholder="Correo electrónico" required>
    <input type="password" name="contrasena" placeholder="Contraseña" required>
    <input type="text" name="nombre_establecimiento" placeholder="Nombre del Establecimiento" required>
    <input type="text" name="direccion" placeholder="Dirección" required>
    <button type="submit">Registrarse</button>
  </form>
</div>

</body>
</html>
